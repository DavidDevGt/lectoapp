services:
  # Base de datos PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: lectoapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lectoapp}
      # Sin valor por defecto a propósito: `:?` aborta el arranque si falta.
      # Una contraseña por defecto en un archivo versionado es una credencial pública.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es requerido — copia .env.example a .env}
      POSTGRES_DB: ${POSTGRES_DB:-lectoapp}
    # Sin `ports:` — Postgres es alcanzable como `postgres:5432` dentro de la red
    # de Docker. Publicarlo al host expondría los datos de menores a la LAN.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lectoapp} -d ${POSTGRES_DB:-lectoapp}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Servidor Ollama (IA Local)
  ollama:
    image: ollama/ollama:latest
    container_name: lectoapp-ollama
    restart: unless-stopped
    # Sin `ports:` — Ollama no tiene autenticación. Publicarlo al host permitiría
    # a cualquiera en la LAN ejecutar inferencia arbitraria. El backend lo alcanza
    # como `ollama:11434` dentro de la red de Docker.
    volumes:
      - ollama_storage:/root/.ollama

  # Terminación TLS y único punto de entrada público
  caddy:
    image: caddy:2-alpine
    container_name: lectoapp-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - admin

  # Backend REST API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lectoapp-backend
    restart: unless-stopped
    # Sin `ports:` — el backend NO se publica al host. Solo es alcanzable como
    # `backend:3000` dentro de la red de Docker, a través de nginx y Caddy.
    # Publicarlo dejaría abierta una vía en HTTP plano que evita el TLS.
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-lectoapp}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es requerido}@postgres:5432/${POSTGRES_DB:-lectoapp}?schema=public
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      UPLOAD_DIR: ./uploads
      UPLOAD_PUBLIC_PATH: /uploads
      # Secretos obligatorios sin fallback. Genéralos con `openssl rand -base64 48`
      # y déjalos en tu `.env` local, nunca en este archivo.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET es requerido — copia .env.example a .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET es requerido — copia .env.example a .env}
      ADMIN_CORS_ORIGIN: https://${PUBLIC_DOMAIN:-localhost}
      # URL pública con la que el backend construye las URLs de las imágenes
      # subidas. Debe ser el dominio de Caddy, no el host interno.
      API_URL: https://${PUBLIC_DOMAIN:-localhost}
      # Saltos de proxy entre el cliente y Express: Caddy -> nginx. Ver la nota
      # en src/config/env.ts sobre por qué es un número exacto y nunca `true`.
      TRUST_PROXY_HOPS: 2
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  # Panel Admin (React SPA) — servido por nginx detrás de Caddy
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: lectoapp-admin
    restart: unless-stopped
    # Sin `ports:` — se llega al panel por Caddy (HTTPS), nunca directo por HTTP.
    depends_on:
      - backend

volumes:
  postgres_data:
  ollama_storage:
  uploads_data:
  caddy_data:
  caddy_config:
