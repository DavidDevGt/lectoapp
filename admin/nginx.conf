# ==============================================================================
# nginx — sirve la SPA del panel y reenvía la API al backend
# ==============================================================================
# Corre DETRÁS de Caddy, que es quien termina TLS. nginx nunca ve HTTP público:
# escucha en el puerto 80 dentro de la red de Docker y no se publica al host.
#
# Las cabeceras de seguridad viven en security-headers.conf y se incluyen en
# cada location — ver la explicación en ese fichero.
# ==============================================================================

# Si Caddy ya declaró el esquema, se respeta; si no (llamada directa dentro de
# la red de Docker), se cae al esquema real de esta conexión.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No anunciar la versión de nginx en las respuestas ni en las páginas de error.
    server_tokens off;

    # El backend acepta subidas de 5 MB; se deja margen para el envoltorio
    # multipart. Corta las peticiones enormes antes de que lleguen a Node.
    client_max_body_size 6m;

    include /etc/nginx/snippets/security-headers.conf;

    # --------------------------------------------------------------------------
    # API REST
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        # Sin estas dos, Express ve siempre la IP de este contenedor y mete a
        # todos los usuarios en el mismo cubo de rate limiting. Caddy ya
        # reemplazó X-Forwarded-For por la IP real del cliente; aquí se le añade
        # la de Caddy, dejando "cliente, caddy" — los dos saltos que espera
        # TRUST_PROXY_HOPS=2.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;

        # Aquí NO se incluye security-headers.conf a propósito: helmet() ya firma
        # las respuestas de Express con una política pensada para una API. Añadir
        # encima la de la SPA dejaría dos cabeceras contradictorias en cada
        # respuesta. Como este bloque no emite ningún `add_header` propio,
        # tampoco descarta nada heredado.
    }

    # --------------------------------------------------------------------------
    # Imágenes subidas
    # --------------------------------------------------------------------------
    # Las sirve Express desde el volumen de subidas. Reenviarlas por aquí las
    # mantiene en el MISMO origen que el panel, que es lo que permite que la CSP
    # use `img-src 'self'` sin tener que abrir el origen de la API.
    location /uploads/ {
        proxy_pass http://backend:3000/uploads/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # Express marca estas imágenes como `cross-origin` para que el panel
        # pudiera cargarlas desde otro puerto en desarrollo. Aquí van por el
        # mismo origen, así que se descarta la cabecera del upstream antes de
        # poner la propia: `add_header` AÑADE, no reemplaza, y la respuesta
        # saldría con dos valores contradictorios.
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_hide_header Content-Security-Policy;

        # Contenido subido por usuarios: política propia y más cerrada que la de
        # la SPA. Nunca dejar que el navegador adivine el tipo, y que no se
        # ejecute nada si algún día se cuela un archivo que no sea imagen.
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; sandbox" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    # --------------------------------------------------------------------------
    # SPA
    # --------------------------------------------------------------------------
    # Los assets llevan hash en el nombre y son inmutables. El index.html nunca
    # se cachea, o un despliegue nuevo seguiría sirviendo el bundle viejo.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
