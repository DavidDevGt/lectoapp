# ==============================================================================
# Cabeceras de seguridad de la SPA del panel
# ==============================================================================
# Este fichero se INCLUYE en cada bloque `location` que emite cabeceras propias.
#
# La repetición no es accidental: en nginx, un `add_header` dentro de un
# `location` descarta TODAS las cabeceras heredadas del bloque `server` padre.
# Un solo `add_header Cache-Control` en el location de la SPA bastaría para
# dejar el index.html sin CSP — justo el documento donde más falta hace. Con el
# include, cada location vuelve a declararlas de forma explícita.
#
# `helmet()` firma solo las respuestas de Express; el HTML y el JavaScript del
# panel salen de nginx sin pasar por Node, así que estas son las únicas
# cabeceras que protegen a la SPA.
#
# HSTS NO va aquí: la emite Caddy, que es quien habla TLS. Duplicarla desde
# detrás del proxy solo lleva a que las dos se desincronicen.
# ==============================================================================

# La SPA no carga nada de terceros, así que la política puede ser estricta.
# 'unsafe-inline' aparece solo en style-src: Radix UI y React inyectan estilos
# en línea para posicionar diálogos y no hay forma de evitarlo sin nonces por
# respuesta. script-src NO lo lleva, que es lo que de verdad frena un XSS.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# El panel no usa cámara, micrófono ni ubicación. Negarlos evita que se los pida
# un script inyectado.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
