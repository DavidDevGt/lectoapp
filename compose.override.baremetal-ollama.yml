# ==============================================================================
# Docker Compose Override: Ollama en Mismo Servidor Host (Bare-Metal / Systemd)
# ==============================================================================
# Usar este override cuando Ollama está instalado en el MISMO servidor físico
# que Docker (corriendo nativamente como servicio systemd en puerto 11434).
#
# Uso:
#   docker compose -f compose.yml -f compose.override.baremetal-ollama.yml up -d
#
# O renombrando a override predeterminado:
#   cp compose.override.baremetal-ollama.yml docker-compose.override.yml
#   docker compose up -d
# ==============================================================================

services:
  # Desactiva el contenedor local de Ollama para evitar colisión de puerto 11434
  ollama:
    profiles:
      - disabled
    entrypoint: ["true"]

  # Enruta el Backend dentro de Docker hacia el Host OS vía host.docker.internal
  backend:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
